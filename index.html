<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pet - PWA & Android Obsidian Export Version</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-y: auto;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .pet-stage {
            width: 320px;
            height: 320px;
            background-color: #2b2b2b;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pet-stage svg {
            width: 80%;
            height: 80%;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 12px;
            color: #74b9ff;
            letter-spacing: 0.5px;
        }

        .activate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            z-index: 10000;
            cursor: pointer;
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .activate-btn {
            background: #0984e3;
            color: white;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.4);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 10px;
        }

        .activate-btn:hover {
            background: #74b9ff;
            transform: scale(1.05);
        }

        .activate-hint {
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }

        #cameraStream {
            position: absolute;
            width: 160px;
            height: 120px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        .anim-emotion {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .anim-gaze {
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .log-container {
            width: 320px;
            background: #252525;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
        }

        .chat-log {
            height: 60px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            color: #aaa;
        }

        .hint-text {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
        }

        .control-panel {
            display: none;
            width: 320px;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .debug-console {
            width: 320px;
            height: 160px;
            background: #000;
            border: 1px solid #00b894;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #00ff66;
            overflow-y: auto;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-indicators {
            position: fixed;
            bottom: 12px;
            right: 15px;
            font-size: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
        }

        .api-key-input {
            width: 100%;
            font-size: 12px;
            background: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <video id="cameraStream" autoplay playsinline muted></video>

    <div class="main-container">
        <div class="pet-stage" id="petStage" onclick="handleStageClick()">
            <div id="activateOverlay" class="activate-overlay" onclick="event.stopPropagation()">
                <button class="activate-btn" onclick="triggerActivation()">Vaultフォルダを選択して起動</button>
                <div class="activate-hint">タップしてAndroidのファイル選択画面からObsidianのVaultフォルダを指定してください。</div>
            </div>

            <div id="statusBadge" class="status-badge">未起動</div>
            <svg viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="600" height="600" fill="none"/>
                <g id="faceGroup" class="anim-gaze" style="transform-origin: 300px 300px;">
                    <g id="leftEyeGroup" class="anim-emotion" style="transform-origin: 175px 237px;">
                        <rect id="leftEye" class="anim-emotion" x="170" y="147" width="10" height="180" rx="0" stroke="#0030FF" stroke-width="12" fill="none"/>
                    </g>
                    <g id="rightEyeGroup" class="anim-emotion" style="transform-origin: 425px 237px;">
                        <rect id="rightEye" class="anim-emotion" x="420" y="147" width="10" height="180" rx="0" stroke="#0030FF" stroke-width="12" fill="none"/>
                    </g>
                    <path id="mouth" class="anim-emotion" d="M275 390 Q300 415 325 390" stroke="#0030FF" stroke-width="12" stroke-linecap="round" fill="none"/>
                </g>
            </svg>
        </div>

        <div class="log-container">
            <div id="chatLog" class="chat-log">フォルダを選択して起動してね！</div>
            <div class="hint-text">📁 ObsidianのVaultフォルダに直接書き込みます</div>
        </div>
    </div>

    <div id="controlPanel" class="control-panel">
        <div>
            <label style="font-size: 12px; color: #74b9ff; display: block; margin-bottom: 4px;">Gemini API キー:</label>
            <input type="password" id="geminiApiKey" class="api-key-input" placeholder="AIキーを入力" onchange="saveApiKeyToVault(this.value)">
        </div>

        <div>
            <label style="font-size: 12px; color: #74b9ff; display: block; margin-bottom: 4px;">音声選択:</label>
            <select id="voiceSelect" onchange="changeVoice(this)" style="width: 100%; font-size: 12px; background: #252525; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 6px; box-sizing: border-box;"></select>
        </div>

        <div>
            <div style="font-size: 12px; color: #74b9ff; margin-bottom: 4px;">🐞 リアルタイムログコンソール</div>
            <div id="debugConsole" class="debug-console">[SYSTEM] 画面ログコンソール初期化完了...</div>
        </div>
    </div>

    <div id="statusIndicators" class="status-indicators">
        <span id="indSquare" style="color: #00b894;">■</span>
        <span id="indCircle" style="color: #00b894;">●</span>
    </div>

    <script>
        function dbgLog(msg, isError = false) {
            const el = document.getElementById('debugConsole');
            if (!el) return;
            const time = new Date().toTimeString().split(' ')[0];
            const prefix = isError ? '[ERROR]' : '[LOG]';
            el.innerText += `\n${time} ${prefix} ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        window.addEventListener('error', (e) => {
            dbgLog(`${e.message} (${e.filename}:${e.lineno})`, true);
        });

        let IS_AI_MODE = true;

        let vaultDirHandle = null; 
        let knownFaces = []; 
        let knownLocations = []; 
        let currentPresentPersons = new Set(); 
        let personSeenTimestamps = new Map(); 

        let isWaitingForLocationName = false;
        let pendingLocationCoords = null;
        let isWaitingForName = false;          
        let pendingFaceDescriptor = null;      
        let currentKnownLocationName = "お出かけ先";
        let japaneseVoices = [];
        let selectedVoice = null;
        let voicesInitialized = false;

        let blinkTimer = null;
        let gazeTimer = null;
        let safetyTimeout = null;
        let envCheckTimer = null;
        let isSpeaking = false;
        let lastPetSpeech = ""; 

        let hasUserRespondedInTurn = false; 
        let hasRetriedSilence = false;      

        let isApiProcessing = false;
        let envCheckBackoffDelay = 60000;
        let wakeLockObj = null;

        let lastFrameImageData = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLockObj = await navigator.wakeLock.request('screen');
                    dbgLog("[SYSTEM] 画面常時点灯（スリープ防止）を有効化しました");
                    
                    wakeLockObj.addEventListener('release', () => {
                        dbgLog("[SYSTEM] 画面常時点灯が解除されました", true);
                    });
                }
            } catch (err) {
                dbgLog(`[WakeLockエラー] ${err.message}`, true);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                dbgLog("[SYSTEM] 画面復帰を検知。WakeLockとカメラ状態を再点検します");
                
                if (wakeLockObj !== null) {
                    await requestWakeLock();
                }

                const videoEl = document.getElementById('cameraStream');
                if (videoEl && videoEl.srcObject) {
                    try {
                        await videoEl.play();
                        dbgLog("[カメラ] フォーカス復帰に伴いビデオ再生を再開しました");
                    } catch (err) {
                        dbgLog(`[カメラ復旧エラー] ${err.message}`, true);
                    }
                }
            }
        });

        function loadApiKey() {
            const savedKey = localStorage.getItem('gemini_api_key') || '';
            const inputEl = document.getElementById('geminiApiKey');
            if (inputEl) inputEl.value = savedKey;
            return savedKey;
        }

        async function writeMarkdownFile(subDir, fileName, content, append = false) {
            if (!vaultDirHandle) return;
            try {
                const dirHandle = await vaultDirHandle.getDirectoryHandle(subDir, { create: true });
                let fileHandle = null;
                let existingContent = "";

                if (append) {
                    try {
                        fileHandle = await dirHandle.getFileHandle(fileName, { create: false });
                        const file = await fileHandle.getFile();
                        existingContent = await file.text();
                    } catch (e) {
                        fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                    }
                } else {
                    fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                }

                const finalContent = append && existingContent ? existingContent + "\n" + content : content;
                const writable = await fileHandle.createWritable();
                await writable.write(finalContent);
                await writable.close();
                dbgLog(`[保存成功] ${subDir}/${fileName}`);
            } catch (err) {
                dbgLog(`[保存失敗] ${err.message}`, true);
            }
        }

        async function saveApiKeyToVault(key) {
            if (!vaultDirHandle || !key) return;
            await writeMarkdownFile("Settings", "API_KEY.md", key.trim(), false);
            localStorage.setItem('gemini_api_key', key.trim());
            dbgLog("[API KEY] Settings/API_KEY.md へ正常に保存しました");
            
            const inputEl = document.getElementById('geminiApiKey');
            if (inputEl) inputEl.value = key.trim();
        }

        async function loadApiKeyFromVault() {
            if (!vaultDirHandle) return null;
            try {
                const settingsDir = await vaultDirHandle.getDirectoryHandle("Settings", { create: false });
                const fileHandle = await settingsDir.getFileHandle("API_KEY.md", { create: false });
                const file = await fileHandle.getFile();
                const text = await file.text();
                const key = text.trim();
                if (key) {
                    localStorage.setItem('gemini_api_key', key);
                    dbgLog("[API KEY] Settings/API_KEY.md からキーを自動読込しました");
                    const inputEl = document.getElementById('geminiApiKey');
                    if (inputEl) inputEl.value = key;
                    return key;
                }
            } catch (err) {
                dbgLog("[API KEY] Vault内に Settings/API_KEY.md は存在しません");
            }
            return null;
        }

        function captureCameraFrame() {
            const videoEl = document.getElementById('cameraStream');
            if (!videoEl || videoEl.paused || videoEl.ended || videoEl.readyState < 2) {
                return null;
            }
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.4);
            return {
                base64: dataUrl.split(',')[1] || null,
                rawPixels: imageData.data
            };
        }

        function calculateImageDifference(newPixels, oldPixels) {
            if (!oldPixels || newPixels.length !== oldPixels.length) return 1.0;
            let diffCount = 0;
            const threshold = 35;

            for (let i = 0; i < newPixels.length; i += 4) {
                const avgNew = (newPixels[i] + newPixels[i+1] + newPixels[i+2]) / 3;
                const avgOld = (oldPixels[i] + oldPixels[i+1] + oldPixels[i+2]) / 3;
                if (Math.abs(avgNew - avgOld) > threshold) {
                    diffCount++;
                }
            }
            return diffCount / (newPixels.length / 4);
        }

        async function executeGeminiRequest(systemInstruction, imageBase64 = null, timeoutMs = 7000) {
            const apiKey = loadApiKey();
            if (!apiKey) throw new Error("APIキーが未設定です");

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
            const parts = [{ text: systemInstruction }];

            if (imageBase64) {
                parts.push({
                    inlineData: {
                        mimeType: "image/jpeg",
                        data: imageBase64
                    }
                });
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: "user", parts }] }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status}`;
                    const err = new Error(errMsg);
                    err.status = response.status;
                    throw err;
                }

                const data = await response.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                
                return rawText.replace(/```json/g, '').replace(/```/g, '').trim();

            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function analyzeEnvironment() {
            if (isApiProcessing || isSpeaking || isConversing || isSleeping || isWaitingForName || isWaitingForLocationName) return;

            const frame = captureCameraFrame();
            if (!frame || !frame.base64) {
                dbgLog("[環境分析] カメラ画像が取得できないためスキップします");
                scheduleNextEnvCheck(15000);
                return;
            }

            const diffRatio = calculateImageDifference(frame.rawPixels, lastFrameImageData);
            lastFrameImageData = frame.rawPixels;

            if (diffRatio < 0.05) {
                dbgLog(`[環境分析スキップ] 周囲に大きな変化はありません (変化率: ${(diffRatio * 100).toFixed(1)}%)`);
                scheduleNextEnvCheck(envCheckBackoffDelay);
                return;
            }

            dbgLog(`[環境変化検知] 変化率 ${(diffRatio * 100).toFixed(1)}% を検知。Geminiへ問い合わせます`);

            isApiProcessing = true;
            const presentPersonsArray = Array.from(currentPresentPersons);
            const personContext = presentPersonsArray.length > 0 
                ? presentPersonsArray.join('さん、') + 'さん' 
                : '誰もいない（または特定できない）';

            const systemInstruction = `あなたはAIペットです。現在の状態と送られたカメラ画像を見て、周りの状況（明るさ、出来事、周囲の物体、持ち物、ユーザーの動作など）を観察し、独り言として話しかけてください。

【現在の統合メタデータ】
- 現在地: ${currentKnownLocationName}
- 目の前にいる人物: ${personContext}

【判定条件】
特段変わったことや反応すべき出来事がなければ "shouldSpeak": false と答えて静かにしてください。
何か面白い変化や話しかけるべき状態があれば "shouldSpeak": true としてください。

以下のJSON形式のみで回答してください:
{
  "shouldSpeak": boolean,
  "emotion": "Happy" | "Anger" | "Surprised" | "Sad" | "Default",
  "text": "40文字以内の話し言葉"
}`;

            try {
                dbgLog("[環境分析] 周囲の画像をGeminiマルチモーダルへ送信中...");
                const rawText = await executeGeminiRequest(systemInstruction, frame.base64, 15000);
                envCheckBackoffDelay = 60000;

                const jsonMatch = rawText.match(/\{[\s\S]*?\}/);
                if (jsonMatch) {
                    const parsed = JSON.parse(jsonMatch[0]);
                    dbgLog(`[環境分析結果] shouldSpeak:${parsed.shouldSpeak}, 感情:${parsed.emotion}, テキスト:"${parsed.text}"`);

                    if (parsed.shouldSpeak && parsed.text && !isSpeaking && !isConversing) {
                        const chatLog = document.getElementById('chatLog');
                        if (chatLog) {
                            chatLog.innerHTML += `<br><strong>ペット(独り言):</strong> ${parsed.text}`;
                        }

                        await saveEpisodeToVault(
                            "環境の自動観察",
                            `カメラで周囲の様子を察知して発話した: 「${parsed.text}」`,
                            currentKnownLocationName,
                            presentPersonsArray
                        );

                        setEmotion(parsed.emotion || 'Happy');
                        speak(parsed.text, () => {
                            setEmotion('Default');
                            scheduleNextEnvCheck(envCheckBackoffDelay);
                        });
                        return;
                    }
                }
            } catch (err) {
                if (err.status === 429) {
                    dbgLog(`[環境分析] レート制限(429)発生。次回待機時間を ${envCheckBackoffDelay / 1000}秒 に延長します`, true);
                    scheduleNextEnvCheck(envCheckBackoffDelay);
                    envCheckBackoffDelay = Math.min(envCheckBackoffDelay * 2, 300000);
                    return;
                }
                const isAbort = err.name === 'AbortError';
                const errorReason = isAbort ? "通信タイムアウト (15秒制限)" : err.message;
                dbgLog(`[環境分析エラー] ${errorReason}`, true);
            } finally {
                isApiProcessing = false;
            }

            scheduleNextEnvCheck(envCheckBackoffDelay);
        }

        function scheduleNextEnvCheck(delay = 60000) {
            if (envCheckTimer) clearTimeout(envCheckTimer);
            envCheckTimer = setTimeout(analyzeEnvironment, delay);
        }

        function isExactWordMatch(text, targetName) {
            if (!text || !targetName) return false;
            const escapedName = targetName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`${escapedName}(さん|ちゃん|くん|様|が|は|に|と|の|を|って|だ|よ|？|！|\\s|$)`);
            return pattern.test(text);
        }

        async function searchRelatedEpisodes(userText) {
            if (!vaultDirHandle || !userText) return "";

            const matchedPersons = knownFaces.map(f => f.name).filter(name => isExactWordMatch(userText, name));
            const matchedLocations = knownLocations.map(l => l.name).filter(name => isExactWordMatch(userText, name));

            if (matchedPersons.length === 0 && matchedLocations.length === 0) {
                return "";
            }

            let extractedEpisodes = [];
            const now = new Date();
            const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));

            try {
                const dirHandle = await vaultDirHandle.getDirectoryHandle("Episodes", { create: false });

                for await (const [name, handle] of dirHandle.entries()) {
                    if (handle.kind === 'file' && name.endsWith('.md')) {
                        const datePart = name.replace('.md', '');
                        const fileDate = new Date(datePart);

                        if (isNaN(fileDate.getTime()) || fileDate < thirtyDaysAgo) {
                            continue;
                        }

                        const file = await handle.getFile();
                        const text = await file.text();

                        const targets = [
                            ...matchedPersons.map(p => `[[${p}]]`),
                            ...matchedLocations.map(l => `[[${l}]]`)
                        ];

                        const blocks = text.split('\n---\n');
                        for (const block of blocks) {
                            const hasMatch = targets.some(target => block.includes(target));
                            if (hasMatch) {
                                const datePrefix = `[日付: ${datePart}]`;
                                extractedEpisodes.push(`${datePrefix}\n${block.trim()}`);
                            }
                        }
                    }
                }
            } catch (err) {
                dbgLog(`[関連エピソード検索エラー] ${err.message}`, true);
            }

            if (extractedEpisodes.length === 0) return "";

            const recentRelated = extractedEpisodes.slice(-4).join('\n\n');
            dbgLog(`[関連エピソード参照(直近30日)] ${matchedPersons.concat(matchedLocations).join(', ')} に関する過去ログ ${extractedEpisodes.length}件 を検出しました`);

            return recentRelated;
        }

        async function callGeminiAPI(userPrompt, previousPetSpeech = "", todayContext = "", relatedContext = "", maxRetries = 3) {
            if (isApiProcessing) {
                dbgLog("[Gemini] 他のAPI通信が実行中のためリクエストを保留します", true);
                return { emotion: 'Sad', text: "ちょっと待ってね、考え中だよ。" };
            }

            isApiProcessing = true;
            const contextText = previousPetSpeech ? `【直前のAIペットの発話】: 「${previousPetSpeech}」\n` : "";
            const episodeText = todayContext ? `【直近・本日の出来事・エピソードログ】:\n${todayContext}\n` : "";
            const relatedText = relatedContext ? `【検索された人物・場所に関する過去の記憶・エピソード】:\n${relatedContext}\n` : "";

            const systemInstruction = `あなたは可愛らしいAIペットです。
これまでの本日のエピソード、検索された過去の記憶（人物や場所に関する情報）、および直前の問いかけを踏まえて、ユーザーの発言に対して自然に文脈や記憶を繋げて回答してください。

${episodeText}
${relatedText}
${contextText}

【ユーザーの発言】: 「${userPrompt}」

フォーマット:
{"emotion":"Happy|Anger|Surprised|Sad|Default","text":"40文字以内の話し言葉"}

感情基準:
Happy: 嬉しい、挨拶、褒められた
Anger: 怒られた、いじわる
Surprised: 驚き、びっくり
Sad: 悲しい、バイバイ
Default: その他通常会話`;

            try {
                for (let attempt = 1; attempt <= maxRetries; attempt++) {
                    try {
                        dbgLog(`[Gemini リクエスト送信 (試行 ${attempt}/${maxRetries})] "${userPrompt}"`);
                        const rawText = await executeGeminiRequest(systemInstruction, null, 7000);
                        dbgLog(`[Gemini 受信テキスト] ${rawText}`);

                        const jsonMatch = rawText.match(/\{[\s\S]*?\}/);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            const validEmotions = ['Happy', 'Anger', 'Surprised', 'Sad', 'Default'];
                            const emotion = validEmotions.includes(parsed.emotion) ? parsed.emotion : 'Happy';
                            const text = parsed.text || "うん！分かったよ！";
                            
                            dbgLog(`[Gemini 解析成功] 感情:${emotion}, テキスト:"${text}"`);
                            return { emotion, text };
                        } else {
                            dbgLog("[Gemini 警告] JSON構造が見つかりません。直接テキストとして処理します", true);
                            return { emotion: 'Happy', text: rawText.substring(0, 40) };
                        }

                    } catch (err) {
                        const isAbort = err.name === 'AbortError';
                        const errorReason = isAbort ? "通信タイムアウト (7秒制限)" : err.message;
                        dbgLog(`[Gemini 試行 ${attempt} 失敗] ${errorReason}`, true);

                        if (attempt === maxRetries) {
                            return {
                                emotion: 'Sad',
                                text: "ごめんね、通信が混雑していて上手くお返事が考えられなかったよ。"
                            };
                        }

                        const delayMs = Math.pow(2, attempt - 1) * 1000;
                        dbgLog(`[Gemini 自動リトライ] ${delayMs / 1000}秒後に再試行します...`);
                        await new Promise(resolve => setTimeout(resolve, delayMs));
                    }
                }
            } finally {
                isApiProcessing = false;
            }
        }

        function createRecognitionInstance() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                dbgLog("このブラウザは音声認識非対応です", true);
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'ja-JP';
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                isListening = true;
                updateIndicators();
                dbgLog("[音声認識] 聞き取り中...");
                
                if (safetyTimeout) clearTimeout(safetyTimeout);
                safetyTimeout = setTimeout(() => {
                    if (isConversing || isWaitingForName || isWaitingForLocationName) {
                        dbgLog("[警告] 音声認識がタイムアウトしました。状態を強制リセットします", true);
                        try { rec.stop(); } catch(e) {}
                        resetInteractionState(5000);
                    }
                }, 20000);
            };

            rec.onresult = async (event) => {
                if (safetyTimeout) { clearTimeout(safetyTimeout); safetyTimeout = null; }

                hasUserRespondedInTurn = true; 
                hasRetriedSilence = false;

                const rawTranscript = event.results[0][0].transcript.trim();
                const transcript = rawTranscript.replace(/[\s ]/g, '').toLowerCase();
                
                dbgLog(`[音声認識結果] ${rawTranscript} (正規化: ${transcript})`);
                const chatLog = document.getElementById('chatLog');
                if (chatLog) {
                    chatLog.innerHTML = `<strong>あなた:</strong> ${rawTranscript}`;
                }

                if (transcript.includes('デバッグ') || transcript.includes('でばっぐ') || transcript.includes('debug')) {
                    const panel = document.getElementById('controlPanel');
                    if (panel) {
                        const isCurrentlyHidden = (panel.style.display === 'none' || panel.style.display === '');
                        panel.style.display = isCurrentlyHidden ? 'flex' : 'none';
                        dbgLog(`[UI] コントロールパネルを${isCurrentlyHidden ? '表示' : '非表示'}にしました`);
                        initVoices();
                        loadApiKey();

                        setEmotion('Happy');
                        speak(isCurrentlyHidden ? "デバッグパネルを表示したよ！" : "デバッグパネルを隠したよ！", () => {
                            resetInteractionState(8000);
                        });
                    }
                    return;
                }

                if (transcript.includes('スリープ') || transcript.includes('すりーぷ') || transcript.includes('sleep')) {
                    isSleeping = true;
                    setEmotion('SLEEP');
                    dbgLog("[SYSTEM] 音声コマンドにより SLEEP モードへ移行しました");
                    speak("おやすみなさい...", () => {
                        resetInteractionState(1000);
                    });
                    return;
                }

                if (isWaitingForName) {
                    isWaitingForName = false;
                    const transcriptClean = rawTranscript.replace(/[\\/:*?"<>|]/g, '').trim();

                    const denyKeywords = ['違う', 'ううん', 'いや', 'いいえ', 'やめる', 'キャンセル', 'ちがう'];
                    const isDenied = denyKeywords.some(keyword => transcriptClean.includes(keyword));

                    if (isDenied || !transcriptClean) {
                        speak("そっか、人違いだったんだね。ごめんね！", () => {
                            resetInteractionState(15000);
                        });
                        return;
                    }

                    const personName = transcriptClean;
                    const suffixes = ['さん', 'ちゃん', 'くん', 'やん'];
                    const hasSuffix = suffixes.some(suffix => personName.endsWith(suffix));
                    const speakName = hasSuffix ? personName : `${personName}さん`;

                    speak(`「${speakName}」だね。覚えたよ！`, async () => {
                        await savePersonToVault(personName, pendingFaceDescriptor);
                        currentPresentPersons.add(personName);
                        personSeenTimestamps.set(personName, Date.now());
                        setEmotion('Happy');
                        setTimeout(() => {
                            resetInteractionState(15000);
                        }, 2000);
                    });
                    return;
                }

                if (isWaitingForLocationName) {
                    isWaitingForLocationName = false;
                    const locationName = rawTranscript.replace(/[\\/:*?"<>|]/g, '').trim();

                    speak(`「${locationName}」だね。覚えたよ！`, async () => {
                        await saveLocationToVault(locationName, pendingLocationCoords);
                        
                        const presentPersonsArray = Array.from(currentPresentPersons);
                        const personText = presentPersonsArray.length > 0 
                            ? `${presentPersonsArray.join('さん、')}さんと一緒に` 
                            : '';

                        await saveEpisodeToVault(
                            `${locationName}への到着`,

                            locationName,
                            presentPersonsArray
                        );

                        setEmotion('Happy');
                        setTimeout(() => {
                            resetInteractionState(8000);

                if (IS_AI_MODE) {
                    const nowTime = Date.now();
                    knownFaces.forEach(f => {
                        if (isExactWordMatch(rawTranscript, f.name)) {
                            currentPresentPersons.add(f.name);
                            personSeenTimestamps.set(f.name, nowTime);
                            dbgLog(`[コンテキスト自動補完] テキストから人物「${f.name}」を正確に検出し設定しました`);
                        }
                    });

                    currentPresentPersons.forEach(pName => {
                        personSeenTimestamps.set(pName, nowTime);
                    });

                    const todayContext = await getTodayEpisodeText();
                    const relatedContext = await searchRelatedEpisodes(rawTranscript);

                    const aiResult = await callGeminiAPI(rawTranscript, lastPetSpeech, todayContext, relatedContext);
                    
                    if (chatLog) {
                        chatLog.innerHTML += `<br><strong>ペット:</strong> ${aiResult.text}`;
                    }

                    const isErrorMessage = aiResult.text.includes("通信が混雑") || aiResult.text.includes("考えられなかった");

                    if (!isErrorMessage) {
                        const presentPersonsArray = Array.from(currentPresentPersons);

                        let conversationText = "";
                        if (lastPetSpeech) {
                            conversationText += `ペット: 「${lastPetSpeech}」\n`;
                        }
                        conversationText += `ユーザー: 「${rawTranscript}」\nペット: 「${aiResult.text}」`;

                        await saveEpisodeToVault(
                            "会話の記録",

                            presentPersonsArray
                        );
                    } else {
                        dbgLog("[ログ制御] 通信エラーメッセージのため Vault への保存をスキップしました");
                    }

                    setEmotion(aiResult.emotion);

                    speak(aiResult.text, () => {
                        resetInteractionState(8000);
                    });
                    return;
                }

                resetInteractionState(8000);
            };

            rec.onerror = (event) => {
                dbgLog(`[音声エラー] ${event.error}`, true);
                resetInteractionState(8000);
            };

            rec.onend = () => {
                isListening = false;
                updateIndicators();
                dbgLog("[音声認識] 終了");

                if (isConversing && !hasUserRespondedInTurn && !hasRetriedSilence && !isSleeping) {
                    hasRetriedSilence = true;
                    dbgLog("[音声認識] 発話未検知による無音終了。1秒後に1回だけ自動リトライします...");
                    setTimeout(() => {
                        if (isConversing && !isListening && !isSpeaking) {

                } else {
                    dbgLog("[音声認識] 会話をクリアして通常待機モードへ戻ります");
                    resetInteractionState(5000);
                }
            };

            return rec;
        }

        async function getTodayEpisodeText() {
            if (!vaultDirHandle) return "";
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const filename = `${dateStr}.md`;

            let combinedText = "";

            try {
                const dirHandle = await vaultDirHandle.getDirectoryHandle("Episodes", { create: false });
                
                if (now.getHours() < 5) {
                    const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));
                    const prevFilename = `${yesterday.toISOString().split('T')[0]}.md`;
                    try {
                        const prevHandle = await dirHandle.getFileHandle(prevFilename, { create: false });
                        const prevFile = await prevHandle.getFile();
                        combinedText += await prevFile.text() + "\n\n";
                    } catch (e) {}
                }

                try {
                    const fileHandle = await dirHandle.getFileHandle(filename, { create: false });
                    const file = await fileHandle.getFile();
                    combinedText += await file.text();
                } catch (e) {}

                return combinedText;
            } catch (err) {
                return "";
            }
        }

        async function savePersonToVault(personName, descriptor) {

            const content = `# 人物: ${personName}\n**登録日時**: ${new Date().toLocaleString()}\n\n\`\`\`json\n${jsonStr}\n\`\`\`\n`;

            await writeMarkdownFile("Persons", filename, content, false);

            knownFaces.push({
                name: personName,
                descriptor: descriptor
            });

        }

        async function loadKnownFacesFromVault() {
            if (!vaultDirHandle) return;
            knownFaces = [];
            try {
                const personsDir = await vaultDirHandle.getDirectoryHandle("Persons", { create: true });
                for await (const [name, handle] of personsDir.entries()) {
                    if (handle.kind === 'file' && name.endsWith('.md')) {
                        const file = await handle.getFile();
                        const text = await file.text();
                        const match = text.match(/```json\s*([\s\S]*?)\s*```/);
                        if (match) {
                            const data = JSON.parse(match[1]);
                            if (data.descriptor) {
                                knownFaces.push({
                                    name: name.replace('.md', ''),
                                    descriptor: new Float32Array(data.descriptor)
                                });
                            }
                        }
                    }
                }
                dbgLog(`顔データ復元: ${knownFaces.length}人`);
            } catch (err) {
                dbgLog("Persons読み込み完了");
            }
        }

        async function loadKnownLocationsFromVault() {
            if (!vaultDirHandle) return;
            knownLocations = [];
            try {
                const locationsDir = await vaultDirHandle.getDirectoryHandle("Locations", { create: true });
                for await (const [name, handle] of locationsDir.entries()) {
                    if (handle.kind === 'file' && name.endsWith('.md')) {
                        const file = await handle.getFile();
                        const text = await file.text();
                        const match = text.match(/\*\*緯度・経度\*\*:\s*([0-9.-]+),\s*([0-9.-]+)/);
                        if (match) {
                            knownLocations.push({
                                name: name.replace('.md', ''),
                                lat: parseFloat(match[1]),
                                lon: parseFloat(match[2])
                            });
                        }
                    }
                }
                dbgLog(`場所データ復元: ${knownLocations.length}件`);
            } catch (err) {
                dbgLog("Locations読み込み完了");
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        async function getCurrentLocation() {
            if (!navigator.geolocation) return { lat: null, lon: null };

            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition((position) => {
                    resolve({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    });
                }, (error) => {
                    resolve({ lat: null, lon: null });
                }, { timeout: 5000 });
            });
        }

        async function checkOrAskLocation() {
            const coords = await getCurrentLocation();
            
            if (!coords.lat || !coords.lon) {
                currentKnownLocationName = "お出かけ先";
                return { isKnown: true, name: currentKnownLocationName, message: "現在地が取得できなかったよ。" };
            }

            const THRESHOLD_METERS = 80;
            const matched = knownLocations.find(loc => {
                const dist = calculateDistance(coords.lat, coords.lon, loc.lat, loc.lon);
                return dist <= THRESHOLD_METERS;
            });

            if (matched) {
                currentKnownLocationName = matched.name;
                return {
                    isKnown: true,
                    name: matched.name,
                    message: `ここは前に来たことがある「${matched.name}」だね！`
                };
            } else {
                pendingLocationCoords = coords;
                isWaitingForLocationName = true;
                isConversing = true;
                return {
                    isKnown: false,
                    name: null,
                    message: "ここは初めて来る場所かな？場所の名前を教えて！"
                };
            }
        }

        async function saveLocationToVault(locationName, coords) {
            const filename = `${locationName}.md`;
            const latStr = coords && coords.lat !== null ? coords.lat : "不明";
            const lonStr = coords && coords.lon !== null ? coords.lon : "不明";

            const content = `# 場所: ${locationName}\n**緯度・経度**: ${latStr}, ${lonStr}\n**登録日時**: ${new Date().toLocaleString()}\n`;
            await writeMarkdownFile("Locations", filename, content, false);

            if (coords && coords.lat !== null && coords.lon !== null) {
                knownLocations.push({
                    name: locationName,
                    lat: coords.lat,
                    lon: coords.lon
                });
            }
            currentKnownLocationName = locationName;
        }

        // 動的なスクリプト読み込み関数（バックアップCDN用）
        function loadScriptAsync(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function triggerActivation() {
            if (isActivated) return;

            if (!window.showDirectoryPicker) {
                alert("showDirectoryPicker 非対応です");
                return;
            }

            try {
                dbgLog("フォルダ選択処理を開始...");
                vaultDirHandle = await window.showDirectoryPicker();
                isActivated = true;
                dbgLog("フォルダの権限取得成功");

                await requestWakeLock();

                const overlay = document.getElementById('activateOverlay');
                const badge = document.getElementById('statusBadge');
                const chatLog = document.getElementById('chatLog');

                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 300);

                badge.innerText = "初期化中...";

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const dummy = new SpeechSynthesisUtterance("");
                    window.speechSynthesis.speak(dummy);
                }

                badge.innerText = "マイク確認中";
                dbgLog("マイク（音声入力）の権限を要求中...");
                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioStream.getTracks().forEach(track => track.stop());
                    dbgLog("マイクのパーミッション取得成功");
                } catch (micErr) {
                    dbgLog(`[マイク警告] ${micErr.message}`, true);
                }

                badge.innerText = "カメラ起動中";
                dbgLog("カメラへのアクセスを要求中...");
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                
                const videoEl = document.getElementById('cameraStream');
                videoEl.srcObject = stream;
                
                await new Promise((resolve) => {
                    videoEl.onloadedmetadata = () => {
                        videoEl.play().then(() => {
                            dbgLog("カメラストリーム再生開始成功");
                            resolve();
                        }).catch(e => {
                            dbgLog(`[カメラ再生例外] ${e.message}`, true);
                            resolve();
                        });
                    };
                    if (videoEl.readyState >= 2) {
                        videoEl.play().catch(() => {});
                        resolve();
                    }
                });

                badge.innerText = "ライブラリ確認中";
                dbgLog("faceapi のロード状態を確認中...");

                // 1. まずグローバルスコープへのロードをチェック
                let waitCount = 0;
                while ((typeof faceapi === 'undefined' || !faceapi.nets) && waitCount < 6) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    waitCount++;
                }

                // 2. それでも読み込まれていなければ別CDNから動的読み込みを試行
                if (typeof faceapi === 'undefined' || !faceapi.nets) {
                    dbgLog("[警告] 主力CDNからの読込失敗を検出。予備CDN (cdn.jsdelivr.net) から再読み込みします...", true);
                    try {
                        await loadScriptAsync('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js');
                        dbgLog("予備CDNからのスクリプト読み込みに成功しました");
                    } catch (backupErr) {
                        dbgLog("[エラー] 予備CDNからの読み込みにも失敗しました", true);
                    }
                }

                if (typeof faceapi === 'undefined' || !faceapi.nets) {
                    throw new Error("face-api.js の読み込みに失敗しました。インターネット接続状況を確認してください。");
                }

                badge.innerText = "モデル読込中";
                const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
                dbgLog(`モデルをロード開始: ${MODEL_URL}`);
                
                if (faceapi.nets.tinyFaceDetector) {
                    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                    dbgLog("tinyFaceDetector ロード完了");
                }

                if (faceapi.nets.faceLandmark68Net) {
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    dbgLog("faceLandmark68Net ロード完了");
                }

                const recNet = faceapi.nets.faceRecognitionNet || faceapi.nets.recognitionNet;
                if (recNet) {
                    await recNet.loadFromUri(MODEL_URL);
                    dbgLog("顔認識モデル ロード完了");
                } else {
                    dbgLog("警告: 顔認識モデルのプロパティが見つかりません", true);
                }

                badge.innerText = "記憶を復元中";
                await loadKnownFacesFromVault();
                await loadKnownLocationsFromVault();

                badge.innerText = "APIキー確認中";
                let apiKey = await loadApiKeyFromVault();
                if (!apiKey) {
                    const inputKey = prompt("Gemini APIキーが見つかりませんでした。\nAPIキーを入力してください（Settings/API_KEY.md に自動設置されます）:");
                    if (inputKey && inputKey.trim() !== "") {
                        await saveApiKeyToVault(inputKey.trim());
                    } else {
                        dbgLog("[API KEY] キーの入力がキャンセルされたため、未設定で起動します");
                    }
                }

                badge.innerText = "位置情報確認";
                const locResult = await checkOrAskLocation();

                initVoices();

                badge.innerText = "待機モード";
                const welcomeMsg = `起動完了！Obsidian Vaultと接続したよ！（記憶人数: ${knownFaces.length}人）${locResult.message}`;
                chatLog.innerHTML = `<strong>ペット:</strong> ${welcomeMsg}`;
                setEmotion(locResult.isKnown ? 'Happy' : 'Surprised');
                
                startIdleAnimations();

                speak(welcomeMsg, () => {
                    setEmotion('Default');
                    scheduleNextVisionCheck(2000);
                    scheduleNextEnvCheck(15000);
                });

            } catch (err) {
                dbgLog(`[エラー例外捕捉] ${err.name}: ${err.message}`, true);
                alert("起動エラー: " + err.message);
            }
        }

        function updateIndicators() {
            const indSquare = document.getElementById('indSquare');
            if (!indSquare) return;

            if (isSleeping) indSquare.style.color = '#0984e3'; 
            else if (isListening) indSquare.style.color = '#d63031'; 
            else indSquare.style.color = '#00b894'; 
        }

        function setEmotion(emotionName) {
            if (!emotionPresets[emotionName]) emotionName = 'Default';
            currentEmotion = emotionName;
            const p = emotionPresets[emotionName];

            const lEye = document.getElementById('leftEye');
            const rEye = document.getElementById('rightEye');
            const lGroup = document.getElementById('leftEyeGroup');
            const rGroup = document.getElementById('rightEyeGroup');
            const mouth = document.getElementById('mouth');
            const faceGroup = document.getElementById('faceGroup');

            lEye.setAttribute('x', 175 - p.eyeW / 2);
            rEye.setAttribute('x', 425 - p.eyeW / 2);
            lEye.setAttribute('width', p.eyeW); lEye.setAttribute('height', p.eyeH); lEye.setAttribute('rx', p.eyeRx); lEye.setAttribute('y', p.eyeY);
            rEye.setAttribute('width', p.eyeW); rEye.setAttribute('height', p.eyeH); rEye.setAttribute('rx', p.eyeRx); rEye.setAttribute('y', p.eyeY);
            lGroup.style.transform = `rotate(${p.rotL}deg)`;
            rGroup.style.transform = `rotate(${p.rotR}deg)`;
            mouth.setAttribute('d', p.mouthD);
            
            faceGroup.dataset.shiftY = p.faceY;
            if (emotionName === 'Default' || emotionName === 'SLEEP') {
                faceGroup.style.transform = `translate(0px, ${p.faceY}px)`;
            }

            updateIndicators();
        }

        function startLipSync() {
            stopLipSync();
            const mouth = document.getElementById('mouth');
            let isOpen = false;

            lipSyncInterval = setInterval(() => {
                const preset = emotionPresets[currentEmotion] || emotionPresets.Default;
                isOpen = !isOpen;
                mouth.setAttribute('d', isOpen ? preset.mouthOpenD : preset.mouthD);
            }, 120);
        }

        function stopLipSync() {
            if (lipSyncInterval) {
                clearInterval(lipSyncInterval);
                lipSyncInterval = null;
            }
            const mouth = document.getElementById('mouth');
            const preset = emotionPresets[currentEmotion] || emotionPresets.Default;
            if (mouth) mouth.setAttribute('d', preset.mouthD);
        }

        function isQuestionText(text) {
            if (!text) return false;
            const questionRegex = /[？?]|(かな|ですか|どう|教えて|なの|かい|うか|何|だれ|どこ|いつ|なぜ|どうして)[。！!]?$/;
            return questionRegex.test(text.trim());
        }

        function speak(text, callback) {
            dbgLog(`[発話] ${text}`);
            lastPetSpeech = text; 

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                stopLipSync();

                if (!selectedVoice) initVoices();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.pitch = 1.6; 
                utterance.rate = 1.3;  

                let hasEnded = false;
                const completeSpeech = () => {
                    if (hasEnded) return;
                    hasEnded = true;
                    if (speechSafetyTimer) clearTimeout(speechSafetyTimer);
                    isSpeaking = false;
                    stopLipSync();

                    if (!isSleeping && isQuestionText(text) && !isListening) {
                        dbgLog("[質問検知] 疑問形の発話が完了したため、1200ms後に自動で音声入力を開始します");
                        setTimeout(() => {
                            if (!isListening && !isSpeaking) startListening();
                        }, 1200);
                    } else if (callback) {
                        callback();
                    }
                };

                utterance.onstart = () => { 
                    isSpeaking = true;
                    startLipSync(); 
                };
                utterance.onend = completeSpeech;
                utterance.onerror = (e) => {
                    dbgLog(`[発話エラー] ${e.error}`, true);
                    completeSpeech();
                };

                const estimatedTimeMs = Math.max(3000, text.length * 300);
                const speechSafetyTimer = setTimeout(() => {
                    dbgLog("[発話警告] onendイベント未検知のため強制完了します", true);
                    completeSpeech();
                }, estimatedTimeMs);

                window.speechSynthesis.speak(utterance);
            } else {
                isSpeaking = false;
                if (callback) callback();
            }
        }

        function scheduleNextVisionCheck(delay = 8000) {
            if (isSleeping || isConversing || isWaitingForName || isWaitingForLocationName) return;
            if (visionTimer) clearTimeout(visionTimer);
            visionTimer = setTimeout(() => { performFaceRecognitionCheck(); }, delay);
        }

        async function performFaceRecognitionCheck() {
            if (isApiProcessing || isSleeping || isConversing || isListening || isSpeaking || !isActivated || isWaitingForName || isWaitingForLocationName) {
                scheduleNextVisionCheck(6000);
                return;
            }

            const videoEl = document.getElementById('cameraStream');
            if (!videoEl || videoEl.paused || videoEl.ended || videoEl.readyState < 2) {
                scheduleNextVisionCheck(5000);
                return;
            }

            try {
                dbgLog("[顔認識] 顔検出を試行中...");
                const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
                const detections = await faceapi.detectSingleFace(videoEl, options).withFaceLandmarks().withFaceDescriptor();

                const now = Date.now();

                for (const [name, lastSeen] of personSeenTimestamps.entries()) {
                    if (now - lastSeen > 3 * 60 * 1000) {
                        currentPresentPersons.delete(name);
                        personSeenTimestamps.delete(name);
                        dbgLog(`[人物退出検知] ${name} さんが画面から見なくなって3分経過したため退出処理しました`);
                    }
                }

                if (!detections) {
                    scheduleNextVisionCheck(5000);
                    return;
                }

                const currentDescriptor = detections.descriptor;
                let bestMatchName = null;

                if (knownFaces.length > 0) {
                    const labeledDescriptors = knownFaces.map(f => new faceapi.LabeledFaceDescriptors(f.name, [f.descriptor]));
                    const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
                    const bestMatch = faceMatcher.findBestMatch(currentDescriptor);

                    if (bestMatch && bestMatch.label !== 'unknown') {
                        bestMatchName = bestMatch.label;
                    }
                }

                if (bestMatchName) {
                    personSeenTimestamps.set(bestMatchName, now);

                    if (currentPresentPersons.has(bestMatchName)) {
                        dbgLog(`[顔認識] ${bestMatchName} さんは滞在地です（チェック一時保留）`);
                        scheduleNextVisionCheck(20000);
                        return;
                    }

                    currentPresentPersons.add(bestMatchName);
                    const alreadyGreeted = await hasGreetedTodayFromVault(bestMatchName);

                    if (!alreadyGreeted) {
                        dbgLog(`[顔認識成功] 本日初回の ${bestMatchName} さんを認識しました`);
                        setEmotion('Happy');
                        
                        const greetingText = `${bestMatchName}さん、こんにちは！`;

                        await saveEpisodeToVault(
                            "あいさつ",
                            `顔認証で ${bestMatchName} さんを認識し、あいさつをした: 「${greetingText}」`,
                            currentKnownLocationName,
                            [bestMatchName]
                        );

                        speak(greetingText, () => {
                            setEmotion('Default');
                            scheduleNextVisionCheck(25000);
                        });
                    } else {
                        dbgLog(`[顔認識] ${bestMatchName} さんは本日あいさつ済みのため、本日のエピソードから話題を生成します`);
                        
                        const todayContext = await getTodayEpisodeText();
                        const topicResult = await generateTopicFromContext(bestMatchName, todayContext);
                        
                        setEmotion(topicResult.emotion);
                        
                        const chatLog = document.getElementById('chatLog');
                        if (chatLog) {
                            chatLog.innerHTML += `<br><strong>ペット:</strong> ${topicResult.text}`;
                        }

                        dbgLog("[ログ制御] 再会時の話題発話のため Vault 保存をスキップします");

                        speak(topicResult.text, () => {
                            setEmotion('Default');
                            scheduleNextVisionCheck(30000);
                        });
                    }
                } else {
                    isConversing = true;
                    setEmotion('Surprised');
                    pendingFaceDescriptor = currentDescriptor;
                    isWaitingForName = true;

                    if (safetyTimeout) clearTimeout(safetyTimeout);
                    safetyTimeout = setTimeout(() => {
                        if (isWaitingForName) {
                            dbgLog("[警告] 名前入力待ちがタイムアウトしました", true);
                            resetInteractionState(5000);
                        }
                    }, 25000);

                    const unknownMsg = "あれ？初めて見るお顔だね。お名前を教えて！";
                    const chatLog = document.getElementById('chatLog');
                    if (chatLog) chatLog.innerHTML = `<strong>ペット:</strong> ${unknownMsg}`;

                    speak(unknownMsg, () => {});
                }

            } catch (err) {
                dbgLog(`[顔認識エラー] ${err.message}`, true);
                resetInteractionState(10000);
            }
        }

        function handleStageClick() {
            if (isSpeaking) {
                dbgLog("[タップ無視] ペットが発話中のためタップを受け付けません");
                return;
            }

            if (isSleeping) {
                isSleeping = false;
                setEmotion('Default');

                const videoEl = document.getElementById('cameraStream');
                if (videoEl && videoEl.srcObject) {
                    videoEl.play().catch(e => dbgLog(`[カメラ復帰再生エラー] ${e.message}`, true));
                }

                speak("おはよう！起きたよ。", () => {
                    startIdleAnimations();
                    scheduleNextVisionCheck(2000);
                    scheduleNextEnvCheck(5000);
                });
                return;
            }

            if (isWaitingForName || isWaitingForLocationName) {
                dbgLog("画面タップにより入力待受の音声認識を開始します");
                startListening();
                return;
            }

            dbgLog("画面タップによる通常会話の音声入力を開始します");
            speak("なあに？お話を聞くよ。", () => {
                startListening();
            });
        }
    </script>
