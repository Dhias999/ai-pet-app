<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pet - Folder Picker Vault Version</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <script src="./face-api.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-y: auto;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .pet-stage {
            width: 320px;
            height: 320px;
            background-color: #2b2b2b;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pet-stage svg {
            width: 80%;
            height: 80%;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 12px;
            color: #74b9ff;
            letter-spacing: 0.5px;
        }

        .activate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            z-index: 10000;
            cursor: pointer;
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .activate-btn {
            background: #0984e3;
            color: white;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.4);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 10px;
        }

        .activate-btn:hover {
            background: #74b9ff;
            transform: scale(1.05);
        }

        .activate-hint {
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }

        #cameraStream {
            position: absolute;
            width: 160px;
            height: 120px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        .anim-emotion {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .anim-gaze {
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .log-container {
            width: 320px;
            background: #252525;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
        }

        .chat-log {
            height: 60px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            color: #aaa;
        }

        .hint-text {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
        }

        .control-panel {
            display: none;
            width: 320px;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .debug-console {
            width: 320px;
            height: 160px;
            background: #000;
            border: 1px solid #00b894;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #00ff66;
            overflow-y: auto;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-indicators {
            position: fixed;
            bottom: 12px;
            right: 15px;
            font-size: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
        }

        .api-key-input {
            width: 100%;
            font-size: 12px;
            background: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <video id="cameraStream" autoplay playsinline muted></video>

    <div class="main-container">
        <div class="pet-stage" id="petStage" onclick="handleStageClick()" style="touch-action: none;">
            <div id="activateOverlay" class="activate-overlay" onclick="event.stopPropagation()">
                <button class="activate-btn" onclick="triggerActivation()">Vaultフォルダを選択して起動</button>
                <div class="activate-hint">タップしてファイル選択画面からObsidianのVaultフォルダを指定してください。</div>
            </div>

            <div id="statusBadge" class="status-badge">未起動</div>
            <svg viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg" style="touch-action: none;">
                <rect width="600" height="600" fill="none"/>
                <g id="faceGroup" class="anim-gaze" style="transform-origin: 300px 300px;">
                    <g id="leftEyeGroup" class="anim-emotion" style="transform-origin: 175px 237px;">
                        <rect id="leftEye" class="anim-emotion" x="170" y="147" width="10" height="180" rx="0" stroke="#0030FF" stroke-width="12" fill="none"/>
                    </g>
                    <g id="rightEyeGroup" class="anim-emotion" style="transform-origin: 425px 237px;">
                        <rect id="rightEye" class="anim-emotion" x="420" y="147" width="10" height="180" rx="0" stroke="#0030FF" stroke-width="12" fill="none"/>
                    </g>
                    <path id="mouth" class="anim-emotion" d="M275 390 Q300 415 325 390" stroke="#0030FF" stroke-width="12" stroke-linecap="round" fill="none"/>
                </g>
            </svg>
        </div>

        <div class="log-container">
            <div id="chatLog" class="chat-log">フォルダを選択して起動してね！</div>
            <div class="hint-text">📁 ObsidianのVaultフォルダに直接書き込みます</div>
            <button id="wakeModeButton" type="button" onclick="toggleWakeMode()" style="margin-top:10px;width:100%;padding:9px;border:0;border-radius:8px;background:#0984e3;color:#fff;font-weight:bold;cursor:pointer;">音声呼びかけ待機を開始</button>
            <div id="wakeModeHint" class="hint-text">呼びかけ：「ねえ、ペットの名前」</div>
        </div>
    </div>

    <div id="controlPanel" class="control-panel">
        <div>
            <label style="font-size: 12px; color: #74b9ff; display: block; margin-bottom: 4px;">Gemini API キー:</label>
            <input type="password" id="geminiApiKey" class="api-key-input" placeholder="AIキーを入力" onchange="saveApiKeyToVault(this.value)">
        </div>

        <div>
            <label style="font-size: 12px; color: #74b9ff; display: block; margin-bottom: 4px;">音声選択:</label>
            <select id="voiceSelect" onchange="changeVoice(this)" style="width: 100%; font-size: 12px; background: #252525; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 6px; box-sizing: border-box;"></select>
        </div>

        <div>
            <label for="wakePetName" style="font-size: 12px; color: #74b9ff; display: block; margin-bottom: 4px;">呼びかけに使うペットの名前:</label>
            <input id="wakePetName" class="api-key-input" type="text" maxlength="30" placeholder="例：ポチ">
            <button type="button" onclick="saveWakePetName()" style="margin-top:6px;width:100%;padding:7px;border:0;border-radius:6px;background:#00b894;color:#fff;font-weight:bold;">呼びかけ名を保存</button>
            <div class="hint-text">「ねえ、」＋ここで設定した名前で呼びかけます。Vaultの Settings/PET_NAME.md にも保存します。</div>
        </div>

        <div>
            <div style="font-size: 12px; color: #74b9ff; margin-bottom: 4px;">🐞 リアルタイムログコンソール</div>
            <div id="debugConsole" class="debug-console">[SYSTEM] 画面ログコンソール初期化完了...</div>
        </div>
    </div>

    <div id="statusIndicators" class="status-indicators">
        <span id="indSquare" style="color: #00b894;">■</span>
        <span id="indCircle" style="color: #00b894;">●</span>
    </div>

    <script>
        function dbgLog(msg, isError = false) {
            const el = document.getElementById('debugConsole');
            if (!el) return;
            const time = new Date().toTimeString().split(' ')[0];
            const prefix = isError ? '[ERROR]' : '[LOG]';
            el.innerText += `\n${time} ${prefix} ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        window.addEventListener('error', (e) => {
            dbgLog(`${e.message} (${e.filename}:${e.lineno})`, true);
        });

        // 現在の「YYYY-MM-DD(曜日) HH:mm」形式の日時文字列を取得するヘルパー関数
        function getCurrentDateTimeString() {
            const now = new Date();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dateStr = now.toISOString().split('T')[0];
            const dayStr = days[now.getDay()];
            const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
            return `${dateStr}(${dayStr}) ${timeStr}`;
        }

        // 名前に応じた適切な表示名（敬称の二重化を防止）を返すヘルパー関数
        function getDisplayName(name) {
            if (!name) return '';
            const suffixes = ['さん', 'ちゃん', 'くん', 'やん', '様'];
            const hasSuffix = suffixes.some(suffix => name.endsWith(suffix));
            return hasSuffix ? name : `${name}さん`;
        }

        let IS_AI_MODE = true;

        let vaultDirHandle = null; 
        let knownFaces = []; 
        let knownLocations = []; 
        let currentPresentPersons = new Set(); 
        let personSeenTimestamps = new Map(); 

        let isWaitingForLocationName = false;
        let pendingLocationCoords = null;
        let isWaitingForName = false;          
        let pendingFaceDescriptor = null;      
        let currentKnownLocationName = "お出かけ先";
        let japaneseVoices = [];
        let selectedVoice = null;
        let voicesInitialized = false;

        let blinkTimer = null;
        let gazeTimer = null;
        let safetyTimeout = null;
        let envCheckTimer = null;
        let isSpeaking = false;
        let lastPetSpeech = ""; 

        let hasUserRespondedInTurn = false; 
        let hasRetriedSilence = false;      

        let isApiProcessing = false;
        let wakePetName = localStorage.getItem('ai_pet_wake_name') || 'ポチ';
        let isWakeModeEnabled = false;
        let wakeRecognitionInstance = null;
        let wakeRestartTimer = null;
        let envCheckBackoffDelay = 60000;
        let wakeLockObj = null;

        let lastFrameImageData = null;

        // ★ 非同期ファイル書き込みキュー
        let fileWriteQueue = Promise.resolve();

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLockObj = await navigator.wakeLock.request('screen');
                    dbgLog("[SYSTEM] 画面常時点灯（スリープ防止）を有効化しました");
                    
                    wakeLockObj.addEventListener('release', () => {
                        dbgLog("[SYSTEM] 画面常時点灯が解除されました", true);
                    });
                }
            } catch (err) {
                dbgLog(`[WakeLockエラー] ${err.message}`, true);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                dbgLog("[SYSTEM] 画面復帰を検知。WakeLockとカメラ状態を再点検します");
                
                if (wakeLockObj !== null) {
                    await requestWakeLock();
                }

                const videoEl = document.getElementById('cameraStream');
                if (videoEl && videoEl.srcObject) {
                    try {
                        await videoEl.play();
                        dbgLog("[カメラ] フォーカス復帰に伴いビデオ再生を再開しました");
                    } catch (err) {
                        dbgLog(`[カメラ復旧エラー] ${err.message}`, true);
                    }
                }
            }
        });

        function normalizeWakeText(value) {
            return (value || '').toLowerCase().replace(/[\s、。，．,.!！?？「」『』]/g, '').replace(/ねー/g, 'ねえ');
        }

        function updateWakeModeUI() {
            const button = document.getElementById('wakeModeButton');
            const hint = document.getElementById('wakeModeHint');
            const nameInput = document.getElementById('wakePetName');
            if (nameInput && nameInput.value !== wakePetName) nameInput.value = wakePetName;
            if (button) {
                button.textContent = isWakeModeEnabled ? '音声呼びかけ待機を停止' : '音声呼びかけ待機を開始';
                button.style.background = isWakeModeEnabled ? '#d63031' : '#0984e3';
            }
            if (hint) hint.textContent = `呼びかけ：「ねえ、${wakePetName}」`;
        }

        async function saveWakePetName() {
            const input = document.getElementById('wakePetName');
            const value = (input ? input.value : '').trim().replace(/[\r\n]/g, '').slice(0, 30);
            if (!value) {
                alert('ペットの名前を入力してください。');
                return;
            }
            wakePetName = value;
            localStorage.setItem('ai_pet_wake_name', wakePetName);
            if (vaultDirHandle) {
                const saved = await writeMarkdownFile('Settings', 'PET_NAME.md', wakePetName, false);
                if (!saved) dbgLog('[呼びかけ設定] Vaultへの保存に失敗しました。端末内設定には保存済みです', true);
            }
            updateWakeModeUI();
            dbgLog(`[呼びかけ設定] ペット名を「${wakePetName}」に設定しました`);
        }

        async function loadWakePetNameFromVault() {
            if (!vaultDirHandle) return;
            try {
                const settingsDir = await vaultDirHandle.getDirectoryHandle('Settings', { create: false });
                const fileHandle = await settingsDir.getFileHandle('PET_NAME.md', { create: false });
                const file = await fileHandle.getFile();
                const value = (await file.text()).trim().replace(/[\r\n]/g, '').slice(0, 30);
                if (value) {
                    wakePetName = value;
                    localStorage.setItem('ai_pet_wake_name', wakePetName);
                    dbgLog(`[呼びかけ設定] Vaultからペット名「${wakePetName}」を読み込みました`);
                }
            } catch (err) {
                dbgLog('[呼びかけ設定] Vault内に Settings/PET_NAME.md がないため、端末内設定を使用します');
            }
            updateWakeModeUI();
        }

        function stopWakeRecognition() {
            if (wakeRestartTimer) {
                clearTimeout(wakeRestartTimer);
                wakeRestartTimer = null;
            }
            if (wakeRecognitionInstance) {
                const old = wakeRecognitionInstance;
                wakeRecognitionInstance = null;
                old.onend = null;
                old.onerror = null;
                old.onresult = null;
                try { old.abort(); } catch (e) {}
            }
        }

        function startWakeRecognition() {
            if (!isWakeModeEnabled || !isActivated || isSleeping || isListening || isSpeaking || isApiProcessing || isConversing || wakeRecognitionInstance) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                dbgLog('[呼びかけ待機] このブラウザは音声認識に対応していません', true);
                isWakeModeEnabled = false;
                updateWakeModeUI();
                return;
            }

            try {
                const rec = new SpeechRecognition();
                wakeRecognitionInstance = rec;
                rec.lang = 'ja-JP';
                rec.continuous = true;
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                rec.onstart = () => dbgLog(`[呼びかけ待機] 「ねえ、${wakePetName}」を待っています`);
                rec.onresult = (event) => {
                    for (let i = event.resultIndex || 0; i < event.results.length; i++) {
                        if (!event.results[i].isFinal) continue;
                        const heard = event.results[i][0].transcript || '';
                        const normalized = normalizeWakeText(heard);
                        const wakePhrase = normalizeWakeText('ねえ' + wakePetName);
                        dbgLog(`[呼びかけ認識] ${heard}`);
                        if (normalized.includes(wakePhrase)) {
                            dbgLog(`[呼びかけ検知] 「ねえ、${wakePetName}」を認識しました`);
                            stopWakeRecognition();
                            speak('うん、どうぞ。', () => {
                                if (isWakeModeEnabled && !isSleeping) startListening();
                            });
                            return;
                        }
                    }
                };
                rec.onerror = (event) => {
                    dbgLog(`[呼びかけ待機エラー] ${event.error}`, true);
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        isWakeModeEnabled = false;
                        updateWakeModeUI();
                    }
                };
                rec.onend = () => {
                    if (wakeRecognitionInstance === rec) wakeRecognitionInstance = null;
                    if (isWakeModeEnabled && !isSleeping) {
                        wakeRestartTimer = setTimeout(() => {
                            wakeRestartTimer = null;
                            startWakeRecognition();
                        }, 900);
                    }
                };
                rec.start();
            } catch (err) {
                wakeRecognitionInstance = null;
                dbgLog(`[呼びかけ待機開始失敗] ${err.message}`, true);
                if (isWakeModeEnabled) {
                    wakeRestartTimer = setTimeout(() => {
                        wakeRestartTimer = null;
                        startWakeRecognition();
                    }, 1500);
                }
            }
        }

        function toggleWakeMode() {
            if (!isActivated) {
                alert('先にVaultフォルダを選択して起動してください。');
                return;
            }
            if (isWakeModeEnabled) {
                isWakeModeEnabled = false;
                stopWakeRecognition();
                dbgLog('[呼びかけ待機] 停止しました');
            } else {
                const input = document.getElementById('wakePetName');
                if (input && input.value.trim()) wakePetName = input.value.trim().slice(0, 30);
                if (!wakePetName) wakePetName = 'ポチ';
                localStorage.setItem('ai_pet_wake_name', wakePetName);
                isWakeModeEnabled = true;
                dbgLog(`[呼びかけ待機] 開始します。呼びかけ：「ねえ、${wakePetName}」`);
                startWakeRecognition();
            }
            updateWakeModeUI();
        }

        function loadApiKey() {
            const savedKey = localStorage.getItem('gemini_api_key') || '';
            const inputEl = document.getElementById('geminiApiKey');
            if (inputEl) inputEl.value = savedKey;
            return savedKey;
        }

        // ★ 改善: 排他制御キューを導入した writeMarkdownFile
        async function writeMarkdownFile(subDir, fileName, content, append = false) {
            if (!vaultDirHandle) {
                dbgLog("[保存失敗] Vaultフォルダが選択されていません", true);
                return false;
            }

            fileWriteQueue = fileWriteQueue.then(async () => {
                try {
                    const options = { mode: 'readwrite' };
                    if ((await vaultDirHandle.queryPermission(options)) !== 'granted') {
                        if ((await vaultDirHandle.requestPermission(options)) !== 'granted') {
                            dbgLog("[保存失敗] Vaultへの書き込み権限が拒否されました", true);
                            return false;
                        }
                    }

                    const dirHandle = await vaultDirHandle.getDirectoryHandle(subDir, { create: true });

                    let fileHandle = null;
                    let existingContent = "";

                    if (append) {
                        try {
                            fileHandle = await dirHandle.getFileHandle(fileName, { create: false });
                            const file = await fileHandle.getFile();
                            existingContent = await file.text();
                        } catch (e) {
                            fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                        }
                    } else {
                        fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                    }

                    const finalContent = append && existingContent ? existingContent + "\n" + content : content;
                    const writable = await fileHandle.createWritable();
                    await writable.write(finalContent);
                    await writable.close();

                    dbgLog(`[保存成功] ${subDir}/${fileName}`);
                    return true;
                } catch (err) {
                    dbgLog(`[保存例外] ${subDir}/${fileName}: ${err.name} - ${err.message}`, true);
                    return false;
                }
            }).catch(err => {
                dbgLog(`[キュー実行例外] ${err.message}`, true);
                return false;
            });

            return await fileWriteQueue;
        }

        async function saveApiKeyToVault(key) {
            if (!vaultDirHandle || !key) return;
            await writeMarkdownFile("Settings", "API_KEY.md", key.trim(), false);
            localStorage.setItem('gemini_api_key', key.trim());
            dbgLog("[API KEY] Settings/API_KEY.md へ正常に保存しました");
            
            const inputEl = document.getElementById('geminiApiKey');
            if (inputEl) inputEl.value = key.trim();
        }

        async function loadApiKeyFromVault() {
            if (!vaultDirHandle) return null;
            try {
                const settingsDir = await vaultDirHandle.getDirectoryHandle("Settings", { create: false });
                const fileHandle = await settingsDir.getFileHandle("API_KEY.md", { create: false });
                const file = await fileHandle.getFile();
                const text = await file.text();
                const key = text.trim();
                if (key) {
                    localStorage.setItem('gemini_api_key', key);
                    dbgLog("[API KEY] Settings/API_KEY.md からキーを自動読込しました");
                    const inputEl = document.getElementById('geminiApiKey');
                    if (inputEl) inputEl.value = key;
                    return key;
                }
            } catch (err) {
                dbgLog("[API KEY] Vault内に Settings/API_KEY.md は存在しません");
            }
            return null;
        }

        function captureCameraFrame() {
            const videoEl = document.getElementById('cameraStream');
            if (!videoEl || videoEl.paused || videoEl.ended || videoEl.readyState < 2) {
                return null;
            }
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.4);
            return {
                base64: dataUrl.split(',')[1] || null,
                rawPixels: imageData.data
            };
        }

        function calculateImageDifference(newPixels, oldPixels) {
            if (!oldPixels || newPixels.length !== oldPixels.length) return 1.0;
            let diffCount = 0;
            const threshold = 35;

            for (let i = 0; i < newPixels.length; i += 4) {
                const avgNew = (newPixels[i] + newPixels[i+1] + newPixels[i+2]) / 3;
                const avgOld = (oldPixels[i] + oldPixels[i+1] + oldPixels[i+2]) / 3;
                if (Math.abs(avgNew - avgOld) > threshold) {
                    diffCount++;
                }
            }
            return diffCount / (newPixels.length / 4);
        }

        async function executeGeminiRequest(systemInstruction, imageBase64 = null, timeoutMs = 15000) {
            const apiKey = loadApiKey();
            if (!apiKey) throw new Error("APIキーが未設定です");

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
            const parts = [{ text: systemInstruction }];

            if (imageBase64) {
                parts.push({
                    inline_data: {
                        mime_type: "image/jpeg",
                        data: imageBase64
                    }
                });
            }

            // Google Search Grounding (Web検索機能)
            const requestBody = {
                contents: [{ role: "user", parts }],
                tools: [
                    { googleSearch: {} }
                ]
            };

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status}`;
                    const err = new Error(errMsg);
                    err.status = response.status;
                    throw err;
                }

                const data = await response.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                
                return rawText.replace(/```json/g, '').replace(/```/g, '').trim();

            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        async function analyzeEnvironment() {
            if (isApiProcessing || isSpeaking || isConversing || isSleeping || isWaitingForName || isWaitingForLocationName) return;

            const frame = captureCameraFrame();
            if (!frame || !frame.base64) {
                dbgLog("[環境分析] カメラ画像が取得できないためスキップします");
                scheduleNextEnvCheck(15000);
                return;
            }

            const diffRatio = calculateImageDifference(frame.rawPixels, lastFrameImageData);
            lastFrameImageData = frame.rawPixels;

            if (diffRatio < 0.05) {
                dbgLog(`[環境分析スキップ] 周囲に大きな変化はありません (変化率: ${(diffRatio * 100).toFixed(1)}%)`);
                scheduleNextEnvCheck(envCheckBackoffDelay);
                return;
            }

            dbgLog(`[環境変化検知] 変化率 ${(diffRatio * 100).toFixed(1)}% を検知。Geminiへ問い合わせます`);

            isApiProcessing = true;
            const presentPersonsArray = Array.from(currentPresentPersons);
            const personContext = presentPersonsArray.length > 0 
                ? presentPersonsArray.map(name => getDisplayName(name)).join('、') 
                : '誰もいない（または特定できない）';

            const systemInstruction = `あなたはAIペットです。現在の状態と送られたカメラ画像を見て、周りの状況（明るさ、出来事、周囲の物体、持ち物、ユーザーの動作など）を観察し、独り言として話しかけてください。

【現在の統合メタデータ】
- 現在地: ${currentKnownLocationName}
- 目の前にいる人物: ${personContext}

【判定条件】
特段変わったことや反応すべき出来事がなければ "shouldSpeak": false と答えて静かにしてください。
何か面白い変化や話しかけるべき状態があれば "shouldSpeak": true としてください。

以下のJSON形式のみで回答してください:
{
  "shouldSpeak": boolean,
  "emotion": "Happy" | "Anger" | "Surprised" | "Sad" | "Default",
  "text": "40文字以内の話し言葉"
}`;

            try {
                dbgLog("[環境分析] 周囲の画像をGeminiマルチモーダルへ送信中...");
                const rawText = await executeGeminiRequest(systemInstruction, frame.base64, 15000);
                envCheckBackoffDelay = 60000;

                const jsonMatch = rawText.match(/\{[\s\S]*?\}/);
                if (jsonMatch) {
                    const parsed = JSON.parse(jsonMatch[0]);
                    dbgLog(`[環境分析結果] shouldSpeak:${parsed.shouldSpeak}, 感情:${parsed.emotion}, テキスト:"${parsed.text}"`);

                    if (parsed.shouldSpeak && parsed.text && !isSpeaking && !isConversing) {
                        const chatLog = document.getElementById('chatLog');
                        if (chatLog) {
                            chatLog.innerHTML += `<br><strong>ペット(独り言):</strong> ${parsed.text}`;
                        }

                        await saveEpisodeToVault(
                            "環境の自動観察",
                            `カメラで周囲の様子を察知して発話した: 「${parsed.text}」`,
                            currentKnownLocationName,
                            presentPersonsArray
                        );

                        setEmotion(parsed.emotion || 'Happy');
                        speak(parsed.text, () => {
                            setEmotion('Default');
                            scheduleNextEnvCheck(envCheckBackoffDelay);
                        });
                        return;
                    }
                }
            } catch (err) {
                if (err.status === 429) {
                    dbgLog(`[環境分析] レート制限(429)発生。次回待機時間を ${envCheckBackoffDelay / 1000}秒 に延長します`, true);
                    scheduleNextEnvCheck(envCheckBackoffDelay);
                    envCheckBackoffDelay = Math.min(envCheckBackoffDelay * 2, 300000);
                    return;
                }
                const isAbort = err.name === 'AbortError';
                const errorReason = isAbort ? "通信タイムアウト (15秒制限)" : err.message;
                dbgLog(`[環境分析エラー] ${errorReason}`, true);
            } finally {
                isApiProcessing = false;
            }

            scheduleNextEnvCheck(envCheckBackoffDelay);
        }

        function scheduleNextEnvCheck(delay = 60000) {
            if (envCheckTimer) clearTimeout(envCheckTimer);
            envCheckTimer = setTimeout(analyzeEnvironment, delay);
        }

        function isExactWordMatch(text, targetName) {
            if (!text || !targetName) return false;
            const escapedName = targetName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`${escapedName}(さん|ちゃん|くん|様|が|は|に|と|の|を|って|だ|よ|？|！|\\s|$)`);
            return pattern.test(text);
        }

        async function searchRelatedEpisodes(userText) {
            if (!vaultDirHandle || !userText) return "";

            const matchedPersons = knownFaces.map(f => f.name).filter(name => isExactWordMatch(userText, name));
            const matchedLocations = knownLocations.map(l => l.name).filter(name => isExactWordMatch(userText, name));

            if (matchedPersons.length === 0 && matchedLocations.length === 0) {
                return "";
            }

            let extractedEpisodes = [];
            const now = new Date();
            const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));

            try {
                const dirHandle = await vaultDirHandle.getDirectoryHandle("Episodes", { create: false });

                for await (const [name, handle] of dirHandle.entries()) {
                    if (handle.kind === 'file' && name.endsWith('.md')) {
                        const datePart = name.replace('.md', '');
                        const fileDate = new Date(datePart);

                        if (isNaN(fileDate.getTime()) || fileDate < thirtyDaysAgo) {
                            continue;
                        }

                        const file = await handle.getFile();
                        const text = await file.text();

                        const targets = [
                            ...matchedPersons.map(p => `[[${p}]]`),
                            ...matchedLocations.map(l => `[[${l}]]`)
                        ];

                        const blocks = text.split('\n---\n');
                        for (const block of blocks) {
                            const hasMatch = targets.some(target => block.includes(target));
                            if (hasMatch) {
                                const datePrefix = `[日付: ${datePart}]`;
                                extractedEpisodes.push(`${datePrefix}\n${block.trim()}`);
                            }
                        }
                    }
                }
            } catch (err) {
                dbgLog(`[関連エピソード検索エラー] ${err.message}`, true);
            }

            if (extractedEpisodes.length === 0) return "";

            const recentRelated = extractedEpisodes.slice(-4).join('\n\n');
            dbgLog(`[関連エピソード参照(直近30日)] ${matchedPersons.concat(matchedLocations).join(', ')} に関する過去ログ ${extractedEpisodes.length}件 を検出しました`);

            return recentRelated;
        }

        // Vault全体の全 Markdown ファイルから関連キーワードを横断検索する関数
        async function searchVaultByKeywords(userText) {
            if (!vaultDirHandle || !userText) return "";

            const cleanText = userText.replace(/(教えて|調べて|調べ|について|とは|って|ですか|かな|？|\?|！|!)+$/g, '').trim();
            if (!cleanText || cleanText.length < 2) return "";

            let matchedBlocks = [];
            const stopWords = ['今日', '昨日', '明日', 'なに', '何', 'これ', 'あれ', 'それ'];

            const searchKeywords = knownFaces.map(f => f.name)
                .concat(knownLocations.map(l => l.name))
                .concat([cleanText])
                .filter(k => k && k.length >= 2 && !stopWords.includes(k));

            if (searchKeywords.length === 0) return "";

            async function searchDirectory(dirHandle, pathPrefix = "") {
                for await (const [name, handle] of dirHandle.entries()) {
                    if (handle.kind === 'directory') {
                        if (name !== 'Settings') {
                            await searchDirectory(handle, `${pathPrefix}${name}/`);
                        }
                    } else if (handle.kind === 'file' && name.endsWith('.md')) {
                        try {
                            const file = await handle.getFile();
                            const text = await file.text();

                            const matched = searchKeywords.some(kw => isExactWordMatch(text, kw) || text.includes(kw));
                            if (matched) {
                                const fileNameClean = name.replace('.md', '');
                                const cleanContent = text.replace(/```json[\s\S]*?```/g, '').trim();
                                if (cleanContent) {
                                    matchedBlocks.push(`[参照ファイル: ${pathPrefix}${fileNameClean}]\n${cleanContent.substring(0, 300)}`);
                                }
                            }
                        } catch (e) {}
                    }
                }
            }

            try {
                await searchDirectory(vaultDirHandle);
            } catch (err) {
                dbgLog(`[Vault全検索エラー] ${err.message}`, true);
            }

            if (matchedBlocks.length === 0) return "";

            const uniqueBlocks = Array.from(new Set(matchedBlocks)).slice(-3);
            dbgLog(`[Vault全検索] キーワード「${cleanText}」に関連するVaultファイル ${uniqueBlocks.length}件 を検出しました`);
            return uniqueBlocks.join('\n\n');
        }

        async function callGeminiAPI(userPrompt, previousPetSpeech = "", todayContext = "", relatedContext = "", maxRetries = 3) {
            if (isApiProcessing) {
                dbgLog("[Gemini] 他のAPI通信が実行中のためリクエストを保留します", true);
                return { emotion: 'Sad', text: "ちょっと待ってね、考え中だよ。" };
            }

            isApiProcessing = true;
            const vaultContext = await searchVaultByKeywords(userPrompt);
            const currentDateTime = getCurrentDateTimeString();
            const contextText = previousPetSpeech ? `【直前のAIペットの発話】: 「${previousPetSpeech}」\n` : "";
            const episodeText = todayContext ? `【直近・本日の出来事・エピソードログ】:\n${todayContext}\n` : "";
            const relatedText = relatedContext ? `【検索された人物・場所に関する過去の記憶・エピソード】:\n${relatedContext}\n` : "";
            const vaultKnowledgeText = vaultContext ? `【Obsidian Vault内の記録・情報】:\n${vaultContext}\n` : "";

            const systemInstruction = `あなたは可愛らしいAIペットです。
現在のリアルタイム日時、これまでのエピソード、およびObsidian Vault内に記録された情報を踏まえて、ユーザーの問いかけ（「教えて」「調べて」など）に対して知識や過去の記憶を結びつけ、自然かつ分かりやすく回答してください。

【回答方針】
- ユーザーから質問や調べものの依頼があった場合、【Obsidian Vault内の記録・情報】や【過去のエピソード記憶】に記載されている情報を最優先で参照して説明してください。
- ニュースや最新情報を調べる場合は、一番主要なニュースを1つだけピックアップし、40文字以内の短い話し言葉で要約して答えてください。

【現在のリアルタイム日時】: ${currentDateTime}
${vaultKnowledgeText}
${episodeText}
${relatedText}
${contextText}

【ユーザーの発言】: 「${userPrompt}」

フォーマット:
{"emotion":"Happy|Anger|Surprised|Sad|Default","text":"40文字以内の話し言葉","emo":"内部感情の増減を key+数値 の形でカンマ区切り。変化がなければ空文字"}

内部感情(emo)の基準: 各値は-30〜+30。感情は大きく動かしてよい。変化したものだけ書く。
joy嬉しさ: 褒められた、楽しい話題、挨拶で上がる
affection愛情: 優しくされた、名前を呼ばれたで上がる
anger怒り: 怒られた、いじわる、無視されたで上がる
sadness悲しさ: 悲しい知らせ、バイバイで上がる
excitement興奮: 盛り上がる話題、驚きで上がる
curiosity好奇心: 知らない物・新しい話題が出たら上がる
anxiety不安: 心配な話題、体調不良の訴えで上がる
relief安心: 問題が解決した、無事が分かったら上がる
loneliness寂しさ: 久しぶりの再会では下がり、別れ際で上がる
clinginess甘えたい: かまってほしそうな文脈で上がる
boredom退屈: 話題が尽きたら上がる
sleepiness眠気: 深夜の会話で上がる
hunger空腹: 食事の話題で上がる
例: "emo":"joy+15,affection+8"

感情基準:
Happy: 嬉しい、挨拶、教える・知っている、褒められた
Anger: 怒られた、いじわる
Surprised: 驚き、びっくり
Sad: 悲しい、バイバイ
Default: その他通常会話`;

            try {
                for (let attempt = 1; attempt <= maxRetries; attempt++) {
                    try {
                        dbgLog(`[Gemini リクエスト送信 (試行 ${attempt}/${maxRetries})] "${userPrompt}"`);
                        // ★ タイムアウトを 15秒 (15000ms) に拡張
                        const rawText = await executeGeminiRequest(systemInstruction, null, 15000);
                        dbgLog(`[Gemini 受信テキスト] ${rawText}`);

                        const jsonMatch = rawText.match(/\{[\s\S]*?\}/);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            const validEmotions = ['Happy', 'Anger', 'Surprised', 'Sad', 'Default'];
                            const emotion = validEmotions.includes(parsed.emotion) ? parsed.emotion : 'Happy';
                            const text = parsed.text || "うん！分かったよ！";
                            
                            dbgLog(`[Gemini 解析成功] 感情:${emotion}, テキスト:"${text}"`);
                            // 内部感情エンジンへ増減を適用（emo文字列: "joy+8,anger+3" 形式）
                            try {
                                if (parsed.emo && window.PetEmotion) {
                                    const delta = {};
                                    const re = /([a-z]+)([+-]\d+)/g;
                                    let m;
                                    while ((m = re.exec(String(parsed.emo))) !== null) {
                                        const v = Math.max(-30, Math.min(30, parseInt(m[2], 10) || 0));
                                        if (v) delta[m[1]] = v;
                                    }
                                    if (Object.keys(delta).length) {
                                        window.PetEmotion.update(delta);
                                        dbgLog(`[内部感情] Gemini増減を適用: ${JSON.stringify(delta)}`);
                                    }
                                }
                            } catch (emoErr) { dbgLog(`[内部感情] 適用失敗: ${emoErr.message}`, true); }
                            return { emotion, text };
                        } else {
                            dbgLog("[Gemini 警告] JSON構造が見つかりません。直接テキストとして処理します", true);
                            return { emotion: 'Happy', text: rawText.substring(0, 40) };
                        }

                    } catch (err) {
                        const isAbort = err.name === 'AbortError';
                        const errorReason = isAbort ? "通信タイムアウト (15秒制限)" : err.message;
                        dbgLog(`[Gemini 試行 ${attempt} 失敗] ${errorReason}`, true);

                        if (attempt === maxRetries) {
                            return {
                                emotion: 'Sad',
                                text: "ごめんね、通信が混雑していて上手くお返事が考えられなかったよ。"
                            };
                        }

                        const delayMs = Math.pow(2, attempt - 1) * 1000;
                        dbgLog(`[Gemini 自動リトライ] ${delayMs / 1000}秒後に再試行します...`);
                        await new Promise(resolve => setTimeout(resolve, delayMs));
                    }
                }
            } finally {
                isApiProcessing = false;
            }
        }

        // ★ 音声認識および全対話状態を強制リセットするリカバリー関数
        function forceResetSpeechRecognition() {
            dbgLog("[SYSTEM] リカバリー: 音声認識と対話状態を強制リセットします");

            if (recognitionInstance) {
                try {
                    recognitionInstance.onstart = null;
                    recognitionInstance.onend = null;
                    recognitionInstance.onerror = null;
                    recognitionInstance.onresult = null;
                    recognitionInstance.abort();
                } catch (e) {}
                recognitionInstance = null;
            }

            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                } catch (e) {}
            }

            if (safetyTimeout) { clearTimeout(safetyTimeout); safetyTimeout = null; }
            
            isListening = false;
            isSpeaking = false;
            isConversing = false;
            isApiProcessing = false;
            isWaitingForName = false;
            isWaitingForLocationName = false;
            pendingFaceDescriptor = null;
            pendingLocationCoords = null;
            hasUserRespondedInTurn = false;
            hasRetriedSilence = false;

            stopLipSync();
            if (!isSleeping) setEmotion('Default');
            updateIndicators();
        }

        function resetInteractionState(delay = 8000) {
            isWaitingForName = false;
            isWaitingForLocationName = false;
            isConversing = false;
            pendingFaceDescriptor = null;
            pendingLocationCoords = null;
            hasUserRespondedInTurn = false;
            hasRetriedSilence = false;
            if (safetyTimeout) {
                clearTimeout(safetyTimeout);
                safetyTimeout = null;
            }
            if (!isSleeping) setEmotion('Default');
            scheduleNextVisionCheck(delay);
            scheduleNextEnvCheck(envCheckBackoffDelay);
            if (isWakeModeEnabled && !isSleeping) {
                if (wakeRestartTimer) clearTimeout(wakeRestartTimer);
                wakeRestartTimer = setTimeout(() => {
                    wakeRestartTimer = null;
                    startWakeRecognition();
                }, 1200);
            }
            dbgLog("[SYSTEM] インタラクション状態をリセットしました");
        }

        function createRecognitionInstance() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                dbgLog("このブラウザは音声認識非対応です", true);
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'ja-JP';
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                isListening = true;
                updateIndicators();
                dbgLog("[音声認識] 聞き取り中...");
                
                if (safetyTimeout) clearTimeout(safetyTimeout);
                safetyTimeout = setTimeout(() => {
                    if (isConversing || isWaitingForName || isWaitingForLocationName) {
                        dbgLog("[警告] 音声認識がタイムアウトしました。状態を強制リセットします", true);
                        try { rec.stop(); } catch(e) {}
                        resetInteractionState(5000);
                    }
                }, 20000);
            };

            rec.onresult = async (event) => {
                if (safetyTimeout) { clearTimeout(safetyTimeout); safetyTimeout = null; }

                hasUserRespondedInTurn = true; 
                hasRetriedSilence = false;

                const rawTranscript = event.results[0][0].transcript.trim();
                const transcript = rawTranscript.replace(/[\s ]/g, '').toLowerCase();
                
                dbgLog(`[音声認識結果] ${rawTranscript} (正規化: ${transcript})`);
                const chatLog = document.getElementById('chatLog');
                if (chatLog) {
                    chatLog.innerHTML = `<strong>あなた:</strong> ${rawTranscript}`;
                }

                if (transcript.includes('デバッグ') || transcript.includes('でばっぐ') || transcript.includes('debug')) {
                    const panel = document.getElementById('controlPanel');
                    if (panel) {
                        const isCurrentlyHidden = (panel.style.display === 'none' || panel.style.display === '');
                        panel.style.display = isCurrentlyHidden ? 'flex' : 'none';
                        dbgLog(`[UI] コントロールパネルを${isCurrentlyHidden ? '表示' : '非表示'}にしました`);
                        initVoices();
                        loadApiKey();

                        setEmotion('Happy');
                        speak(isCurrentlyHidden ? "デバッグパネルを表示したよ！" : "デバッグパネルを隠したよ！", () => {
                            resetInteractionState(8000);
                        });
                    }
                    return;
                }

                if (transcript.includes('スリープ') || transcript.includes('すりーぷ') || transcript.includes('sleep')) {
                    isSleeping = true;
                    setEmotion('SLEEP');
                    dbgLog("[SYSTEM] 音声コマンドにより SLEEP モードへ移行しました");
                    speak("おやすみなさい...", () => {
                        resetInteractionState(1000);
                    });
                    return;
                }

                if (isWaitingForName) {
                    isWaitingForName = false;
                    const savedDescriptor = pendingFaceDescriptor;
                    pendingFaceDescriptor = null;
                    
                    const transcriptClean = cleanNameEnd(rawTranscript.replace(/[\\/:*?"<>|]/g, '').trim());
                    const denyKeywords = ['違う', 'ううん', 'いや', 'いいえ', 'やめる', 'キャンセル', 'ちがう'];
                    const isDenied = denyKeywords.some(keyword => transcriptClean.includes(keyword));

                    if (isDenied || !transcriptClean) {
                        speak("そっか、人違いだったんだね。ごめんね！", () => {
                            resetInteractionState(15000);
                        });
                        return;
                    }

                    let extractedName = transcriptClean.replace(/(だよ|です|だ|よ|ー|～|！|!|？|\?)+$/g, '').trim();
                    if (!extractedName) extractedName = transcriptClean;

                    const personName = cleanNameEnd(extractedName);
                    const speakName = getDisplayName(personName);

                    savePersonToVault(personName, savedDescriptor).then(() => {
                        currentPresentPersons.add(personName);
                        personSeenTimestamps.set(personName, Date.now());
                    }).catch(err => {
                        dbgLog(`[人物保存例外] ${err.message}`, true);
                    });

                    speak(`「${speakName}」だね。覚えたよ！`, () => {
                        setEmotion('Happy');
                        setTimeout(() => {
                            resetInteractionState(15000);
                        }, 2000);
                    });
                    return;
                }

                if (isWaitingForLocationName) {
                    isWaitingForLocationName = false;
                    const savedCoords = pendingLocationCoords;
                    pendingLocationCoords = null;

                    const locationName = cleanNameEnd(rawTranscript.replace(/[\\/:*?"<>|]/g, '').trim());

                    speak(`「${locationName}」だね。覚えたよ！`, async () => {
                        await saveLocationToVault(locationName, savedCoords);
                        
                        const presentPersonsArray = Array.from(currentPresentPersons);
                        const personText = presentPersonsArray.length > 0 
                            ? `${presentPersonsArray.map(name => getDisplayName(name)).join('、')}と一緒に` 
                            : '';

                        await saveEpisodeToVault(
                            `${locationName}への到着`, 
                            `${personText}初めて「${locationName}」にやってきた！`, 
                            locationName,
                            presentPersonsArray
                        );

                        setEmotion('Happy');
                        setTimeout(() => {
                            resetInteractionState(8000);
                        }, 2000);
                    });
                    return;
                }

                if (IS_AI_MODE) {
                    const nowTime = Date.now();
                    knownFaces.forEach(f => {
                        if (isExactWordMatch(rawTranscript, f.name)) {
                            currentPresentPersons.add(f.name);
                            personSeenTimestamps.set(f.name, nowTime);
                            dbgLog(`[コンテキスト自動補完] テキストから人物「${f.name}」を正確に検出し設定しました`);
                        }

                    currentPresentPersons.forEach(pName => {

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        async function getCurrentLocation() {
            if (!navigator.geolocation) {
                dbgLog("[位置情報エラー] ブラウザが Geolocation API に非対応です", true);
                return { lat: null, lon: null, accuracy: null };
            }

            dbgLog("[位置情報] GPS座標を取得中...");

            function tryGet(options) {
                return new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude,
                                accuracy: (position.coords.accuracy != null ? position.coords.accuracy : null)
                            });
                        },
                        (error) => {
                            dbgLog(`[位置情報取得失敗] コード:${error.code}, 詳細:${error.message}`, true);
                            resolve(null);
                        },
                        options
                    );
                });
            }

            const timeoutPromise = new Promise((resolve) => {
                setTimeout(() => {
                    dbgLog("[位置情報警告] 位置情報取得が独自タイムアウト(12秒)しました", true);
                    resolve({ lat: null, lon: null, accuracy: null });
                }, 12000);
            });

            const geoPromise = (async () => {
                // まず高精度（GPS）で取りに行き、失敗したら低精度（ネットワーク測位）に落とす
                let c = await tryGet({ enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
                if (!c) {
                    dbgLog("[位置情報] 高精度測位に失敗したため、低精度で再試行します");
                    c = await tryGet({ enableHighAccuracy: false, timeout: 6000, maximumAge: 60000 });
                }
                if (!c) return { lat: null, lon: null, accuracy: null };
                dbgLog(`[位置情報取得成功] lat: ${c.lat}, lon: ${c.lon}, 精度: ${c.accuracy != null ? Math.round(c.accuracy) + "m" : "不明"}`);
                return c;
            })();

            return await Promise.race([geoPromise, timeoutPromise]);
        }

        async function checkOrAskLocation() {
            const coords = await getCurrentLocation();
            
            if (coords.lat === null || coords.lon === null || isNaN(coords.lat) || isNaN(coords.lon)) {
                currentKnownLocationName = "お出かけ先";
                pendingLocationCoords = null;
                dbgLog("[位置情報判定] 座標が取得できなかったため『お出かけ先』として扱います");
                return { isKnown: true, name: currentKnownLocationName, message: "現在地が取得できなかったよ。" };
            }

            pendingLocationCoords = coords;
            dbgLog(`[位置情報判定] 座標保持: ${coords.lat}, ${coords.lon}, 精度: ${coords.accuracy != null ? Math.round(coords.accuracy) + "m" : "不明"}`);

            // 精度が悪すぎる座標では誤判定（別の場所を登録済みの場所と取り違える等）を避けるため、場所の判定自体をしない
            if (coords.accuracy != null && coords.accuracy > 150) {
                currentKnownLocationName = "お出かけ先";
                pendingLocationCoords = null;
                dbgLog("[位置情報判定] 精度が低すぎるため場所の判定をスキップしました");
                return { isKnown: true, name: currentKnownLocationName, message: "位置情報の精度が低くて、場所の判定ができなかったよ。" };
            }

            // 一致判定は厳しめに: 距離30m以内 かつ 精度60m以内 のときだけ「その場所」と断定する（誤認防止）
            const THRESHOLD_METERS = 30;
            const ACCURACY_LIMIT = 60;
            const matched = knownLocations.find(loc => {
                const dist = calculateDistance(coords.lat, coords.lon, loc.lat, loc.lon);
                return dist <= THRESHOLD_METERS && (coords.accuracy == null || coords.accuracy <= ACCURACY_LIMIT);
            });

            if (matched) {
                currentKnownLocationName = matched.name;
                return {
                    isKnown: true,
                    name: matched.name,
                    message: `ここは前に来たことがある「${matched.name}」だね！`
                };
            } else {
                isWaitingForLocationName = true;
                isConversing = true;
                return {
                    isKnown: false,
                    name: null,
                    message: "ここは初めて来る場所かな？場所の名前を教えて！"
                };
            }
        }

                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function triggerActivation() {
            if (isActivated) return;

            if (!window.showDirectoryPicker) {
                alert("お使いのブラウザ・環境では showDirectoryPicker に非対応です（HTTPS接続で動作させているか確認してください）。");
                return;
            }

            try {
                dbgLog("フォルダ選択処理を開始...");
                vaultDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });

                const permStatus = await vaultDirHandle.requestPermission({ mode: 'readwrite' });
                if (permStatus !== 'granted') {
                    throw new Error("Vaultフォルダへの書き込み権限が許可されませんでした。");
                }

                isActivated = true;
                dbgLog("フォルダの書き込み権限取得に成功しました");

                await requestWakeLock();

                const overlay = document.getElementById('activateOverlay');
                const badge = document.getElementById('statusBadge');
                const chatLog = document.getElementById('chatLog');

                overlay.style.opacity = '0';

                badge.innerText = "初期化中...";

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const dummy = new SpeechSynthesisUtterance("");
                    window.speechSynthesis.speak(dummy);
                }

                badge.innerText = "マイク確認中";
                dbgLog("マイク（音声入力）の権限を要求中...");
                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioStream.getTracks().forEach(track => track.stop());
                    dbgLog("マイクのパーミッション取得成功");
                } catch (micErr) {
                    dbgLog(`[マイク警告] ${micErr.message}`, true);
                }

                badge.innerText = "カメラ起動中";
                dbgLog("カメラへのアクセスを要求中...");
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                
                const videoEl = document.getElementById('cameraStream');
                videoEl.srcObject = stream;
                
                await new Promise((resolve) => {
                    videoEl.onloadedmetadata = () => {
                        videoEl.play().then(() => {
                            dbgLog("カメラストリーム再生開始成功");
                            resolve();
                        }).catch(e => {
                            dbgLog(`[カメラ再生例外] ${e.message}`, true);
                            resolve();
                        });
                    };
                    if (videoEl.readyState >= 2) {
                        videoEl.play().catch(() => {});
                        resolve();
                    }
                });

                badge.innerText = "ライブラリ確認中";
                dbgLog("faceapi のロード状態を確認中...");

                let waitCount = 0;
                while ((typeof faceapi === 'undefined' || !faceapi.nets) && waitCount < 6) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    waitCount++;
                }

                if (typeof faceapi === 'undefined' || !faceapi.nets) {
                    dbgLog("[警告] 主力CDNからの読込失敗を検出。予備CDNから再読み込みします...", true);
                    try {
                        await loadScriptAsync('https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js');
                        dbgLog("予備CDNからのスクリプト読み込みに成功しました");
                    } catch (backupErr) {
                        dbgLog("[エラー] 予備CDNからの読み込みにも失敗しました", true);
                    }
                }

                if (typeof faceapi === 'undefined' || !faceapi.nets) {
                    throw new Error("face-api.js の読み込みに失敗しました。ネット接続状況を確認してください。");
                }

                badge.innerText = "モデル読込中";
                const MODEL_URL = './models';
                dbgLog(`モデルをロード開始: ${MODEL_URL}`);
                
                if (faceapi.nets.tinyFaceDetector) {
                    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                    dbgLog("tinyFaceDetector ロード完了");
                }

                if (faceapi.nets.faceLandmark68Net) {
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    dbgLog("faceLandmark68Net ロード完了");
                }

                const recNet = faceapi.nets.faceRecognitionNet || faceapi.nets.recognitionNet;
                if (recNet) {
                    await recNet.loadFromUri(MODEL_URL);
                    dbgLog("顔認識モデル ロード完了");
                } else {
                    dbgLog("警告: 顔認識モデルのプロパティが見つかりません", true);
                }

                const testSuccess = await writeMarkdownFile("Settings", "INIT_TEST.md", `起動確認: ${new Date().toLocaleString()}`, false);
                if (!testSuccess) {
                    dbgLog("[警告] テストファイルの書き込みに失敗しました。ストレージ制限の可能性があります", true);
                }

                badge.innerText = "記憶を復元中";
                await loadKnownFacesFromVault();
                await loadKnownLocationsFromVault();

                badge.innerText = "APIキー確認中";
                let apiKey = await loadApiKeyFromVault();
                await loadWakePetNameFromVault();
                if (!apiKey) {
                    const inputKey = prompt("Gemini APIキーが見つかりませんでした。\nAPIキーを入力してください（Settings/API_KEY.md に自動設置されます）:");
                    if (inputKey && inputKey.trim() !== "") {
                        await saveApiKeyToVault(inputKey.trim());
                    } else {
                        dbgLog("[API KEY] キーの入力がキャンセルされたため、未設定で起動します");
                    }
                }

                badge.innerText = "位置情報確認";
                const locResult = await checkOrAskLocation();

                initVoices();

                badge.innerText = "待機モード";
                const welcomeMsg = `起動完了！Obsidian Vaultと接続したよ！（記憶人数: ${knownFaces.length}人）${locResult.message}`;
                chatLog.innerHTML = `<strong>ペット:</strong> ${welcomeMsg}`;
                setEmotion(locResult.isKnown ? 'Happy' : 'Surprised');
                
                startIdleAnimations();

                speak(welcomeMsg, () => {
                    setEmotion('Default');
                    scheduleNextVisionCheck(2000);
                    scheduleNextEnvCheck(15000);
                });

            } catch (err) {
                dbgLog(`[エラー例外捕捉] ${err.name}: ${err.message}`, true);
